# 演奏会情報の記入ファイル
#
# 新しい演奏会は、1件分をコピーして追加します。
# 行の先頭の空白や「-」「:」はそのまま残してください。
# 日付・時刻・文章は、半角の " " の中に記入します。
#
# type:
#   regular = 定期演奏会
#   obog    = OB・OG演奏会
#   other   = その他の演奏会
#
# status:
#   preparing = 準備中
#   announced = 告知中
#   accepting = チケット販売・参加受付中
#   closed    = 販売・参加受付終了
#   finished  = 開催終了
#   cancelled = 中止
#
# 空欄は "" のままにします。
# URLや画像が空欄の場合、ボタンや画像を表示しない設計にします。

# 過去記録：演奏会記録.xlsxの公開用項目と既存HPを統合。
# 非公開の団長・コンサートマスター欄は含みません。
# 曲名等の原資料の表記は、改行・余分な空白以外は基本的に維持。

