  title: "木許裕介氏 名誉指揮者就任のお知らせ"
  body: |
    福井大学フィルハーモニー管弦楽団は、2024年11月23日、木許裕介氏に「名誉指揮者（Conductor Emeritus）」の称号を贈りました。

    木許氏には2015年から指揮をお願いし、2019年には当団の常任指揮者に就任いただきました。コロナ禍で活動が制限された時期にも団員に寄り添い、活動を支えてくださいました。

    10年にわたる当団へのご貢献に、心より感謝申し上げます。詳しくは、以下のお知らせ文書をご覧ください。
